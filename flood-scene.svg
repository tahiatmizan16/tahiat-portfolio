<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Animated illustration of heavy rain, rising flood water and a broken road">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#6b7f8e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b7ea6"/>
      <stop offset="1" stop-color="#1f4e6e"/>
    </linearGradient>
  </defs>
  <style>
    .d { stroke: #cfe3f0; stroke-width: 1.6; stroke-linecap: round; opacity: .75; }
  </style>

  <!-- sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- clouds -->
  <g>
    <ellipse cx="120" cy="60" rx="110" ry="38" fill="#3f5566"/>
    <ellipse cx="260" cy="45" rx="90" ry="34" fill="#46596a"/>
    <ellipse cx="560" cy="55" rx="120" ry="40" fill="#3f5566"/>
    <ellipse cx="710" cy="80" rx="90" ry="30" fill="#4a5f70"/>
  </g>

  <!-- buildings on the far bank -->
  <rect x="40" y="190" width="70" height="115" fill="#3a4650"/>
  <rect x="120" y="165" width="55" height="140" fill="#34404a"/>
  <rect x="610" y="175" width="80" height="130" fill="#3a4650"/>
  <rect x="700" y="200" width="70" height="105" fill="#34404a"/>

  <!-- flood water across the scene -->
  <rect x="0" y="330" width="800" height="120" fill="url(#water)"/>
  <g fill="#7fb7d6" opacity=".7">
    <path d="M-100 338 q25 -9 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 L900 450 L-100 450 Z"/>
  </g>

  <!-- road: left part, then a broken gap, then right part -->
  <polygon points="0,300 440,300 428,322 452,338 420,382 0,382" fill="#4b5157"/>
  <polygon points="520,300 800,300 800,382 532,382 548,356 516,336" fill="#4b5157"/>
  <!-- lane markings on the intact road -->
  <line x1="20" y1="342" x2="170" y2="342" stroke="#e2c044" stroke-width="4" stroke-dasharray="26 18"/>
  <line x1="600" y1="342" x2="780" y2="342" stroke="#e2c044" stroke-width="4" stroke-dasharray="26 18"/>
  <!-- cracks at the break -->
  <path d="M430 300 l10 22 l-7 16 l9 22" fill="none" stroke="#1d2226" stroke-width="3"/>
  <path d="M300 300 l-6 18 l8 14" fill="none" stroke="#1d2226" stroke-width="2"/>
  <!-- broken edge highlights -->
  <path d="M428 322 l24 16 l-32 44" fill="none" stroke="#8a9096" stroke-width="2"/>

  <!-- heavy rain falling in front -->
  <g>
    <line class="d" x1="20" y1="-30" x2="14" y2="0" style="animation-delay:-0.1s"/>
    <line class="d" x1="55" y1="-30" x2="49" y2="0" style="animation-delay:-0.6s"/>
    <line class="d" x1="90" y1="-30" x2="84" y2="0" style="animation-delay:-0.3s"/>
    <line class="d" x1="125" y1="-30" x2="119" y2="0" style="animation-delay:-0.8s"/>
    <line class="d" x1="160" y1="-30" x2="154" y2="0" style="animation-delay:-0.2s"/>
    <line class="d" x1="195" y1="-30" x2="189" y2="0" style="animation-delay:-0.9s"/>
    <line class="d" x1="230" y1="-30" x2="224" y2="0" style="animation-delay:-0.45s"/>
    <line class="d" x1="265" y1="-30" x2="259" y2="0" style="animation-delay:-0.05s"/>
    <line class="d" x1="300" y1="-30" x2="294" y2="0" style="animation-delay:-0.7s"/>
    <line class="d" x1="335" y1="-30" x2="329" y2="0" style="animation-delay:-0.35s"/>
    <line class="d" x1="370" y1="-30" x2="364" y2="0" style="animation-delay:-0.95s"/>
    <line class="d" x1="405" y1="-30" x2="399" y2="0" style="animation-delay:-0.25s"/>
    <line class="d" x1="440" y1="-30" x2="434" y2="0" style="animation-delay:-0.65s"/>
    <line class="d" x1="475" y1="-30" x2="469" y2="0" style="animation-delay:-0.15s"/>
    <line class="d" x1="510" y1="-30" x2="504" y2="0" style="animation-delay:-0.5s"/>
    <line class="d" x1="545" y1="-30" x2="539" y2="0" style="animation-delay:-0.85s"/>
    <line class="d" x1="580" y1="-30" x2="574" y2="0" style="animation-delay:-0.4s"/>
    <line class="d" x1="615" y1="-30" x2="609" y2="0" style="animation-delay:-0.75s"/>
    <line class="d" x1="650" y1="-30" x2="644" y2="0" style="animation-delay:-0.12s"/>
    <line class="d" x1="685" y1="-30" x2="679" y2="0" style="animation-delay:-0.55s"/>
    <line class="d" x1="720" y1="-30" x2="714" y2="0" style="animation-delay:-0.28s"/>
    <line class="d" x1="755" y1="-30" x2="749" y2="0" style="animation-delay:-0.9s"/>
    <line class="d" x1="785" y1="-30" x2="779" y2="0" style="animation-delay:-0.42s"/>
  </g>

  <!-- warning label -->
  <rect x="24" y="22" width="190" height="34" rx="6" fill="#b3261e"/>
  <text x="119" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">FLOOD WARNING</text>
</svg>
